# Version 2.8.3
# DO NOT REMOVE THE REPLACEMENT COMMENTS
# REQUIRED BY THE ML4W SETTINGS APP
# https://wiki.hyprland.org/Hypr-Ecosystem/hypridle/

# general {
#     ignore_dbus_inhibit = false
# }

general {
    # The Quickshell lock screen (.config/quickshell/lock/), which replaced
    # hyprlock. No `pidof` guard any more: that existed to stop a second
    # hyprlock process starting on top of the first, and there is no process to
    # duplicate now -- Lock.lock() returns immediately if already locked.
    #
    # hyprlock is deliberately still installed. It is the rescue path if the
    # shell ever wedges while holding the lock; see services/Lock.qml.
    lock_cmd = qs ipc call lock lock
    before_sleep_cmd = loginctl lock-session    # lock before suspend.
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'  # to avoid having to press a key twice to turn on the display.
}

# Screenlock
listener {
    # HYPRLOCK TIMEOUT
    timeout = 600
    # HYPRLOCK ONTIMEOUT
    on-timeout = loginctl lock-session
}

# dpms
listener {
    # DPMS TIMEOUT
    timeout = 660
    # DPMS ONTIMEOUT
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "off" })'
    # DPMS ONRESUME
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}

# Suspend
listener {
    # SUSPEND TIMEOUT
    timeout = 1800
    #SUSPEND ONTIMEOUT
    on-timeout = systemctl suspend
}
