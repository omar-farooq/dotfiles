# Per-user makepkg options.
#
# makepkg sources /etc/makepkg.conf first and this file second (see the SYNOPSIS
# in `man makepkg.conf`: /etc/makepkg.conf, $XDG_CONFIG_HOME/pacman/makepkg.conf,
# ~/.makepkg.conf, with the XDG one winning over ~/.makepkg.conf). Overriding
# here rather than editing /etc/makepkg.conf keeps the change in this repo and
# out of the way of pacman's .pacnew merges.
#
# The only change from the system defaults is `debug` -> `!debug`. With debug on,
# every AUR build also produced a <pkg>-debug package carrying detached debug
# symbols, and nothing ever cleaned them up: by August 2026 there were 19 of them
# orphaned, including mission-center-debug at 160 MiB.
#
# OPTIONS is an array assignment, not a merge, so the whole thing has to be
# restated. If a pacman update changes the system defaults -- watch for
# /etc/makepkg.conf.pacnew -- this list needs the same edit applied again.
#
# To get symbols back for a one-off build, either comment this out or run that
# build with `makepkg --check-option debug`.
OPTIONS=(strip docs !libtool !staticlibs emptydirs zipman purge !debug lto)
