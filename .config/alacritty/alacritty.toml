[general]
# Was themes/themes/tokyo_night_storm.toml. Swap back by pointing at that file.
import = ["~/.config/alacritty/themes/pywal-headphones.toml"]

[font]
size = 12.0

[font.normal]
family = "FiraCode Nerd Font"
style = "Regular"

[window]
opacity = 0.92

[window.padding]
x = 15
y = 15

[selection]
save_to_clipboard = true

[[keyboard.bindings]]
key = "Return"
mods = "Shift"
chars = "\u001B\r"
