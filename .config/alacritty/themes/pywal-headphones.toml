# Pywal palette, frozen.
#
# Generated by pywal from ~/wallpaper/headphones-paint-color-splash.jpg and
# copied here on 2026-08-13 so the scheme survives without pywal running: it
# used to exist only as escape sequences in ~/.cache/wal/sequences, which meant
# it vanished the moment a new terminal opened.
#
# Note this lives in themes/ rather than themes/themes/ -- that inner directory
# is the vendored alacritty-theme repo (144 files) and a re-clone would take
# this with it.
#
# To regenerate after a wallpaper change:
#   wal -i /path/to/wallpaper       # writes ~/.cache/wal/colors.json
# then copy colors0-15, background and foreground across.

[colors.primary]
background = '#110f1e'
foreground = '#78ddea'

[colors.cursor]
text   = '#110f1e'
cursor = '#78ddea'

[colors.selection]
text       = '#110f1e'
background = '#78ddea'

# pywal assigns these by wallpaper hue, not by ANSI meaning, which is why
# "green" is a blue and "yellow" a slate. It is the reason the scheme looks
# unified and also why ls and git diff lose their usual colour cues.
[colors.normal]
black   = '#110f1e'
red     = '#C14039'
# Deliberately NOT pywal's green (#076D8E, which is a blue): green carries
# meaning in a terminal -- added lines, passing tests, executables -- and against
# this teal palette it was indistinguishable from blue and cyan, so a git diff
# read as one colour. This is Tokyo Night Storm's green, kept from the old theme.
green   = '#9ece6a'
yellow  = '#5A6592'
blue    = '#0794B1'
magenta = '#5BA5B8'
cyan    = '#03B1CC'
white   = '#78ddea'

# pywal sets colour0 to the background, so anything printed in normal black is
# invisible here -- fine for most output, awkward for programs that use black as
# a "dim" colour. Lift it if that bites:
#   black = '#2b2842'
[colors.bright]
black   = '#549aa3'
red     = '#C14039'
# Bright green matters too: git renders added lines bold, which most terminals
# resolve to the bright slot. Tokyo Night Storm's bright green.
green   = '#b9f27c'
yellow  = '#5A6592'
blue    = '#0794B1'
magenta = '#5BA5B8'
cyan    = '#03B1CC'
white   = '#78ddea'
